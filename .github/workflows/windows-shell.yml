# A Windows runner, with WSL2 Ubuntu by default, that runs LADO's checks there, the smoke
# tests of every provider among them (tests/smoke/: real CLIs, no model), and uploads the
# logs. Not in the per-push CI (a run takes 20-25 minutes): weekly on main, and by hand,
# also before each release (AGENTS.md, Commands).
name: Windows probe

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted Windows runner
        type: choice
        options: [windows-latest, windows-11-arm]
        default: windows-latest
      wsl:
        description: Set up WSL2 with Ubuntu 24.04 and run the checks there
        type: boolean
        default: true
      tests:
        description: Run make test and make test-integration in WSL
        type: boolean
        default: true
      smoke:
        description: Run the smoke tests in WSL, the real CLIs with no model (needs wsl)
        type: boolean
        default: true
      minutes:
        description: Job length in minutes, setup included (at most 360)
        type: number
        default: 120
      provider:
        description: The smoke tests' provider, or all of them, one after another
        type: choice
        options: [all, claude, codex, opencode, kilo]
        default: all
  # On the default branch, Monday at an off-peak minute, with the inputs' defaults. A red
  # run mails the maintainers.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  # The run's settings, the only job that reads an input. A scheduled run has none: each
  # empty input takes its default above (a test keeps both the same). The booleans come
  # as true/false from the web form, as a string in any case from the API (gh workflow
  # run -f wsl=False): each setting is 'true' or 'false', compared as such below.
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.settings.outputs.runner }}
      wsl: ${{ steps.settings.outputs.wsl }}
      tests: ${{ steps.settings.outputs.tests }}
      smoke: ${{ steps.settings.outputs.smoke }}
      minutes: ${{ steps.settings.outputs.minutes }}
      provider: ${{ steps.settings.outputs.provider }}
    steps:
      - id: settings
        name: Settings
        shell: bash
        env:
          RUNNER: ${{ inputs.runner }}
          WSL: ${{ inputs.wsl }}
          TESTS: ${{ inputs.tests }}
          SMOKE: ${{ inputs.smoke }}
          MINUTES: ${{ inputs.minutes }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          runner=${RUNNER:-windows-latest}
          wsl=$(lower "${WSL:-true}")
          tests=$(lower "${TESTS:-true}")
          smoke=$(lower "${SMOKE:-true}")
          minutes=${MINUTES:-120}
          provider=${PROVIDER:-all}
          for name in wsl tests smoke; do
            case ${!name} in
              true | false) ;;
              *) fail "$name must be true or false, not ${!name}" ;;
            esac
          done
          # A whole number (fromJSON refuses a leading zero), within GitHub's cap.
          if [[ ! $minutes =~ ^[0-9]{1,3}$ ]] || ((10#$minutes < 1 || 10#$minutes > 360)); then
            fail "minutes must be 1 to 360 (GitHub's cap), not $minutes"
          fi
          # scripts/smoke_ci.py's PINS (a test keeps both the same).
          case $provider in
            all | claude | codex | opencode | kilo) ;;
            *) fail "provider must be all, claude, codex, opencode or kilo, not $provider" ;;
          esac
          {
            echo "runner=$runner"
            echo "wsl=$wsl"
            echo "tests=$tests"
            echo "smoke=$smoke"
            echo "minutes=$((10#$minutes))"
            echo "provider=$provider"
          } >>"$GITHUB_OUTPUT"

  probe:
    needs: settings
    runs-on: ${{ needs.settings.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.settings.outputs.minutes) }}
    # Windows' default; said here so that actionlint does not read the scripts as bash.
    defaults:
      run:
        shell: pwsh
    steps:
      # Every check appends a line to checks.tsv: name, exit code, `required` (it decides the
      # verdict) or `expected` (it may fail today; only recorded), and its log's name. First,
      # so that the report steps find the folder also after a guard below failed.
      - name: Report folder
        run: |
          $probe = Join-Path $env:RUNNER_TEMP probe
          New-Item -ItemType Directory -Force $probe | Out-Null
          "PROBE=$probe" | Add-Content $env:GITHUB_ENV

      # setup-wsl's Ubuntu 24.04 is an amd64 image (v7.0.0), which WSL2 on ARM cannot run.
      - name: No WSL on ARM
        if: needs.settings.outputs.runner == 'windows-11-arm' && needs.settings.outputs.wsl == 'true'
        run: |
          Write-Output "::error::setup-wsl installs only amd64 distributions: run windows-11-arm with wsl=false smoke=false"
          exit 1

      - name: No smoke without WSL
        if: (needs.settings.outputs.smoke == 'true') && !(needs.settings.outputs.wsl == 'true')
        run: |
          Write-Output "::error::the smoke tests run in WSL Ubuntu: run wsl=false with smoke=false"
          exit 1

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"

      # LADO does not run on Windows itself yet: each check here is expected to fail.
      - name: Native probe
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:PROBE native.log
          function Check([string]$Name, [scriptblock]$Command) {
            "== $Name" | Add-Content $log
            $global:LASTEXITCODE = 0
            try {
              & $Command 2>&1 | Out-String -Width 200 | Add-Content $log
              $code = $LASTEXITCODE
            } catch {
              $_ | Out-String | Add-Content $log
              $code = 'error'
            }
            "== $Name`: exit $code" | Add-Content $log
            "native $Name`t$code`texpected`tnative.log" | Add-Content (Join-Path $env:PROBE checks.tsv)
          }
          # From the checkout, not PyPI: the probe tests this branch.
          Check 'uv tool install' { uv tool install --force . }
          Check 'python' { uv run --no-project --with . python -c "import platform,sys; print(platform.machine(), sys.version)" }
          Check 'lado --version' { & (Join-Path (uv tool dir --bin) lado.exe) --version }
          Check 'lado doctor' { & (Join-Path (uv tool dir --bin) lado.exe) doctor }
          exit 0

      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        if: needs.settings.outputs.wsl == 'true'
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: tmux git curl build-essential less

      - name: Check WSL
        if: needs.settings.outputs.wsl == 'true'
        env:
          WSL_UTF8: 1
        run: |
          wsl --version
          $list = wsl -l -v | Out-String
          Write-Output $list
          if ($list -notmatch '(?m)Ubuntu-24\.04\s+\S+\s+2\s*$') {
            Write-Output "::error::Ubuntu-24.04 does not run on WSL2"
            exit 1
          }

      # setup-wsl's user is root, which no real user is: the checks run as lado.
      - name: Create the user lado
        if: needs.settings.outputs.wsl == 'true'
        shell: wsl-bash {0}
        run: |
          set -eu
          useradd --create-home --shell /bin/bash lado
          if [ -d /etc/sudoers.d ]; then
            echo 'lado ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/lado
            chmod 440 /etc/sudoers.d/lado
          fi

      # Cloned inside Ubuntu, not the Windows checkout under /mnt/d (CRLF, slow).
      - name: Clone the repo in Ubuntu
        if: needs.settings.outputs.wsl == 'true'
        shell: wsl-bash {0}
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          WSLENV: REPO:REF:SHA
        run: |
          set -eu
          su - lado -c "git clone --branch '$REF' 'https://github.com/$REPO' ~/lado && git -C ~/lado reset --hard '$SHA'"

      # Each check in lado's login shell, under a timeout, so a hang leaves time for the
      # report; a failing check does not stop the later ones.
      - name: WSL probe
        if: needs.settings.outputs.wsl == 'true'
        shell: wsl-bash {0}
        env:
          UV_VERSION: "0.12.3"
          TESTS: ${{ needs.settings.outputs.tests }}
          SMOKE: ${{ needs.settings.outputs.smoke }}
          PROVIDER: ${{ needs.settings.outputs.provider }}
          WSLENV: PROBE/p:UV_VERSION:TESTS:SMOKE:PROVIDER
        run: |
          set -u
          touch "$PROBE/checks.tsv" || exit 1
          check() { # check <name> <seconds> <command> [required|expected]
            local log="wsl-$1.log" code=0
            timeout --kill-after=30 "$2" su - lado -c "$3" >"$PROBE/$log" 2>&1 || code=$?
            printf '%s\t%s\t%s\t%s\n' "wsl $1" "$code" "${4:-required}" "$log" >>"$PROBE/checks.tsv" || exit 1
          }
          skip() { # skip <name>: recorded, neither passed nor failed
            printf '%s\tskipped\tskipped\t-\n' "wsl $1" >>"$PROBE/checks.tsv" || exit 1
          }
          # Each cell's out folder, outside $PROBE: only its evidence is copied there.
          out="${TMPDIR:-/tmp}/lado-smoke-out"
          smoke() { # smoke <provider>: one cell of scripts/smoke_ci.py, its exit code the verdict
            local log="wsl-smoke-$1.log" code=0
            rm -rf "${out:?}/$1"
            timeout --kill-after=30 900 su - lado -c "cd ~/lado && uv run python scripts/smoke_ci.py run $1 $out/$1" >"$PROBE/$log" 2>&1 || code=$?
            printf '%s\t%s\t%s\t%s\n' "wsl smoke-$1" "$code" required "$log" >>"$PROBE/checks.tsv" || exit 1
            if [ -d "$out/$1/evidence" ]; then
              cp -r "$out/$1/evidence" "$PROBE/smoke-evidence-$1"
            fi
          }
          check uname 60 'uname -m'
          check tmux 60 'tmux -V'
          check uv-install 300 "curl -LsSf -o ~/uv-install.sh https://astral.sh/uv/$UV_VERSION/install.sh && sh ~/uv-install.sh"
          # After uv's install, as an agent's PATH would see ~/.local/bin.
          check path 60 'echo "$PATH"'
          check uv-sync 600 'cd ~/lado && uv sync --locked'
          # The agents' PATH as LADO builds it: its own code, from lado's login shell.
          check agents-path 60 'cd ~/lado && env -u LADO_AGENT_ENV uv run python -c "from lado import agent_env; print(agent_env.from_shell()[\"PATH\"])"'
          check lado-version 120 'cd ~/lado && uv run lado --version'
          # No agent CLI is installed, which doctor reports as a FAIL (exit 1): only recorded.
          check lado-doctor 300 'cd ~/lado && uv run lado doctor' expected
          if [ "$TESTS" = true ]; then
            check make-test 1800 'cd ~/lado && make test'
            check make-test-integration 1800 'cd ~/lado && make test-integration'
          else
            skip make-test
            skip make-test-integration
          fi
          # The smoke of each provider, one after another, each a check of its own: the real
          # CLI against a local endpoint that answers 401, no model and no account. Node and
          # npm from Ubuntu; the script installs each CLI into ~/.local/bin, on the agents'
          # PATH.
          if [ "$SMOKE" = true ]; then
            check node 600 'sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs npm && node --version && npm --version'
            providers=$PROVIDER
            if [ "$providers" = all ]; then
              providers=$(timeout 120 su - lado -c 'cd ~/lado && uv run python scripts/smoke_ci.py providers')
            fi
            if [ -z "$providers" ]; then # no cell to run is no green
              printf '%s\t%s\t%s\t%s\n' "wsl smoke-providers" none required - >>"$PROBE/checks.tsv" || exit 1
            fi
            for provider in $providers; do
              smoke "$provider"
            done
          fi
          exit 0

      - name: Summary
        if: always()
        env:
          RUNNER_LABEL: ${{ needs.settings.outputs.runner }}
        run: |
          $checks = Join-Path $env:PROBE checks.tsv
          $out = @("## Windows probe on $env:RUNNER_LABEL ($env:RUNNER_ARCH)", "")
          if (-not (Test-Path $checks)) {
            $out += "No check ran."
            $out | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $rows = @(Import-Csv $checks -Delimiter "`t" -Header name, code, kind, log)
          $out += "| check | exit | counts |", "| --- | --- | --- |"
          foreach ($r in $rows) {
            $counts = switch ($r.kind) {
              'required' { 'yes' }
              'skipped' { 'no (skipped: tests=false)' }
              default { 'no (expected)' }
            }
            $out += "| $($r.name) | $($r.code) | $counts |"
          }
          foreach ($name in 'path', 'agents-path') {
            $file = Join-Path $env:PROBE "wsl-$name.log"
            if (Test-Path $file) {
              $out += "", "${name}: ``$(Get-Content $file -Tail 1)``"
            }
          }
          $failed = $rows | Where-Object { $_.kind -ne 'skipped' -and $_.code -ne '0' } | Select-Object -ExpandProperty log -Unique
          foreach ($log in $failed) {
            $out += "", "<details><summary>$log (last lines)</summary>", "", '```'
            $out += Get-Content (Join-Path $env:PROBE $log) -Tail 20
            $out += '```', "", "</details>"
          }
          $out | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-probe-${{ needs.settings.outputs.runner }}
          path: ${{ env.PROBE }}
          retention-days: 5

      - name: Verdict
        if: always()
        env:
          WSL: ${{ needs.settings.outputs.wsl }}
        run: |
          $checks = Join-Path $env:PROBE checks.tsv
          if (-not (Test-Path $checks)) {
            Write-Output "::error::no check ran"
            exit 1
          }
          $rows = @(Import-Csv $checks -Delimiter "`t" -Header name, code, kind, log)
          if ($env:WSL -eq 'true' -and -not ($rows | Where-Object { $_.name -match '^wsl ' })) {
            Write-Output "::error::wsl is on, but no WSL check was recorded"
            exit 1
          }
          $failed = @($rows | Where-Object { $_.kind -eq 'required' -and $_.code -ne '0' })
          foreach ($r in $failed) {
            Write-Output "::error::$($r.name) failed (exit $($r.code)): see $($r.log) in the report"
          }
          if ($failed) { exit 1 }
