# LADO's image: mise's system config (/etc/mise/config.toml). The image owns it, so a new
# image replaces it and a home volume needs no change; `mise use -g` writes the container's
# own defaults to ~/.config/mise/config.toml on the home volume. The workspace's
# trust is profile.sh's (MISE_TRUSTED_CONFIG_PATHS): it follows the container's LADO_REPOS.
[settings]
# Read besides .tool-versions and mise.toml. Not Node's (.nvmrc, .node-version): the image's
# Node 22 runs Kilo, Codex and kits' MCP servers in the repository's folder, so a repository's
# other Node goes through `mise exec node@<version> -- ...`.
idiomatic_version_file_enable_tools = ["go", "java", "python", "ruby"]
# From mise 2026.11.0 a go.mod names a Go only by its `toolchain` line, or by an exact
# `go X.Y.Z` line when it has none; a minimum `go` line (`go 1.23`) is not read, so it neither
# wins over .go-version nor warns.
# The binary is the image's pin: a newer mise comes with a new image, not from the agents.
disable_update_warning = true
