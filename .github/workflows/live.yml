# LADO's live tests in GitHub Actions, started by hand at each release (AGENTS.md, Release):
# one cell per (system, provider), all in parallel. Linux and macOS here; Windows/WSL2 through
# the Windows probe, called once per provider. The providers are scripts/live_ci.py's PINS,
# free models with no login and no secret (tests/test_live_workflow.py keeps both matrices
# the same); the others run only locally (its LOCAL_ONLY).
name: Live tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cell:
    name: ${{ matrix.os }} ${{ matrix.provider }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        provider: [opencode, kilo]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          python-version: "3.13"

      - name: Out folder
        run: echo "OUT=$RUNNER_TEMP/live" >>"$GITHUB_ENV"

      - name: tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y tmux
          else
            brew install tmux
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*

      - name: uv sync
        run: uv sync --locked

      # The cell's verdict (scripts/live_ci.py: a test passed, none skipped); its exit code
      # also goes to the summary.
      - name: Live tests
        id: live
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          code=0
          uv run python scripts/live_ci.py run "$PROVIDER" "$OUT" || code=$?
          echo "code=$code" >>"$GITHUB_OUTPUT"
          exit "$code"

      - name: Summary
        if: always()
        env:
          CELL: ${{ matrix.os }} ${{ matrix.provider }}
          CODE: ${{ steps.live.outputs.code }}
          LOG: ${{ env.OUT }}/live-${{ matrix.provider }}.log
        run: |
          {
            echo "## Live tests: $CELL, exit ${CODE:-none}"
            if [ "$CODE" != 0 ] && [ -f "$LOG" ]; then
              echo
              echo '```'
              tail -n 30 "$LOG"
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-${{ matrix.os }}-${{ matrix.provider }}
          path: ${{ env.OUT }}
          retention-days: 5

  windows:
    strategy:
      fail-fast: false
      matrix:
        provider: [opencode, kilo]
    uses: ./.github/workflows/windows-shell.yml
    with:
      tests: false
      live: true
      provider: ${{ matrix.provider }}
