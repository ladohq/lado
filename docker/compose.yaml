# LADO's image (Dockerfile), ghcr.io/ladohq/lado:<version>, with compose: the same as one
# `docker run`, kept in a file. Keep the settings in .env next to this file, where compose
# reads them for every command:
#
#   LADO_VERSION=0.39.0                 # the LADO version to run
#   LADO_PROJECTS=/Users/me/projects    # absolute: the container sees it at this path
#   LADO_PORT=8765                      # optional
#
# Then, from this folder:
#
#   docker compose up -d
#   docker compose exec lado lado ui --no-open               # the UI's link with its token
#
# LADO_PORT (8765) is the server's port in the container and the one published on this
# computer's loopback, always the same number. LADO_IMAGE, when set, runs another image
# instead of the version's (lado:local, which `make docker` builds); an older Compose
# still asks for LADO_VERSION beside it.
#
# To update, set the new LADO_VERSION in .env, then (compose pulls that version's image):
#
#   docker compose up -d
#
# A new version upgrades the home volume's lado.db at its start, after a copy of it in
# ~/.lado/backups/lado.db.schema-<N>, N its schema before (`docker compose logs lado`
# names it); an older one refuses the upgraded lado.db. The version before keeps its
# image and its tag. Back to the version you had before: put it back in .env, then (what
# LADO did since the upgrade is lost; when a migration failed, lado.db is as it was, and
# the first and the last command do it):
#
#   docker compose down
#   docker compose run --rm lado sh -c 'cd ~/.lado && rm -f lado.db-wal lado.db-shm && cp backups/lado.db.schema-<N> lado.db'
#   docker compose up -d
#
# A second LADO beside the first: a folder of its own with a copy of this file and an .env
# with its own COMPOSE_PROJECT_NAME (e.g. lado-2), LADO_PORT (8766), LADO_VERSION and
# LADO_PROJECTS. It has its own container, home volume and version: updating one leaves
# the other as it is.
#
# The container's sessions go with it: `docker compose down` (or stop, or Docker's own end)
# stops its sessions, as `lado stop` would, and `docker compose up -d` (or start) resumes
# them, after an upgrade too; so does a start after the container was killed. `lado server
# stop` inside the container ends it the same way. Sessions
# stopped by hand stay stopped. Each resumed session's supervisor takes one model turn at
# the start, and starts the workers of its open flow runs.
name: lado

services:
  lado:
    image: ${LADO_IMAGE:-ghcr.io/ladohq/lado:${LADO_VERSION:?set LADO_VERSION to the LADO version to run, e.g. in .env next to this file}}
    hostname: lado
    environment:
      LADO_PORT: ${LADO_PORT:-8765}
      LADO_REPOS: ${LADO_PROJECTS:?set LADO_PROJECTS to your projects folder}
      # git's identity for the agents' commits, written at every start.
      LADO_GIT_NAME: ${LADO_GIT_NAME:-}
      LADO_GIT_EMAIL: ${LADO_GIT_EMAIL:-}
    ports:
      # This computer only: the UI's token is the one guard.
      - "127.0.0.1:${LADO_PORT:-8765}:${LADO_PORT:-8765}"
    volumes:
      # LADO_HOME (~/.lado) and Claude Code's login and config.
      - home:/home/lado
      # The human's projects at the host's own path (LADO_REPOS above), so a worker's
      # worktree made in the container is one on the host too.
      - ${LADO_PROJECTS:?set LADO_PROJECTS to your projects folder}:${LADO_PROJECTS:?set LADO_PROJECTS to your projects folder}
      # The agents' variables, one file each (LADO_ENV_DIR): never in docker inspect.
      - type: bind
        source: ${LADO_SECRETS:-./secrets}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
      # The host's ssh agent for the agents' git over ssh (LADO_SSH_AGENT; /dev/null: none).
      - type: bind
        source: ${LADO_SSH_AGENT:-/dev/null}
        target: /run/lado/ssh-agent.sock
        bind:
          create_host_path: false
    extra_hosts:
      # A local model on the host: Docker Desktop has it already, a Linux host needs it.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  home:
