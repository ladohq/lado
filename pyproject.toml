[project]
name = "lado"
version = "0.3.0"
description = "Layered Agent Delegation & Orchestration: run teams of AI coding agents (early development)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alexey Kolesnikov" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=2.2,<3",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/ladohq/lado"
Repository = "https://github.com/ladohq/lado"

[project.scripts]
lado = "lado.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lado"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests (real tmux, git and agent processes, no LLM) run with `-m integration`.
addopts = "-m 'not integration'"
markers = ["integration: real tmux, git and subprocesses with a fake agent; no LLM"]
