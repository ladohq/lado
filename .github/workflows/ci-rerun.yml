name: CI rerun

# GitHub now and then cancels a job it found no hosted runner for (mostly a macOS arm64
# smoke cell, "The job was not acquired by Runner of type hosted even after multiple
# attempts"), and ci-ok fails a run nothing in the work broke. When a CI run's first attempt
# failed only so, scripts/ci_rerun.py reruns its failed jobs, once. A workflow_run workflow
# runs the default branch's files: a pull request cannot change what this one does.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  rerun:
    # A superseded run ends cancelled, not failure; the rerun is attempt 2, never looked at.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write # gh run rerun
      checks: read # the jobs' annotations
      contents: read # the checkout of main, for the script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The log says why the run is rerun or not.
      - env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci_rerun.py "$RUN_ID" --rerun
