[project]
name = "lado"
version = "0.0.1"
description = "Layered Agent Delegation & Orchestration: run teams of AI coding agents (early development)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alexey Kolesnikov" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/ladohq/lado"
Repository = "https://github.com/ladohq/lado"

[project.scripts]
lado = "lado.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lado"]
