# LADO's image (Dockerfile) with compose: the same as one `docker run`, kept in a file.
#
#   export LADO_PROJECTS=~/projects     # every compose command of this file needs it;
#                                       # the container sees it at this same path, so
#                                       # it is absolute (e.g. $PWD/projects, not ./)
#   docker compose up -d                # from this folder
#   docker compose exec lado lado ui --no-open               # the UI's link with its token
#
# LADO_PORT (8765) is the server's port in the container and the one published on this
# computer's loopback, always the same number. A second LADO beside the first, with its
# own container and home volume:
#
#   LADO_PORT=8766 docker compose -p lado-2 up -d
#   docker compose -p lado-2 exec lado lado ui --no-open
#
# LADO_IMAGE names the image (lado:local, which `make docker` builds).
#
# A new image upgrades the home volume's lado.db at its start, after a copy of it in
# ~/.lado/backups/lado.db.schema-<N>, N its schema before (`docker compose logs lado`
# names it); an older image refuses the upgraded lado.db. `docker compose pull` gives the
# image's name to the new one, and Docker may then remove the old image (its containerd
# image store does). Before you update, keep a name for the image you run:
#
#   docker tag "$(docker compose images -q lado)" lado:previous
#   docker compose pull && docker compose up -d
#
# Back to the image you had before, lado:previous, with that copy (what LADO did since the
# upgrade is lost); when a migration failed, lado.db is as it was, and the last command
# alone does it:
#
#   docker compose down
#   LADO_IMAGE=lado:previous docker compose run --rm lado sh -c 'cd ~/.lado && rm -f lado.db-wal lado.db-shm && cp backups/lado.db.schema-<N> lado.db'
#   LADO_IMAGE=lado:previous docker compose up -d
#
name: lado

services:
  lado:
    image: ${LADO_IMAGE:-lado:local}
    hostname: lado
    environment:
      LADO_PORT: ${LADO_PORT:-8765}
      LADO_REPOS: ${LADO_PROJECTS:?set LADO_PROJECTS to your projects folder}
    ports:
      # This computer only: the UI's token is the one guard.
      - "127.0.0.1:${LADO_PORT:-8765}:${LADO_PORT:-8765}"
    volumes:
      # LADO_HOME (~/.lado) and Claude Code's login and config.
      - home:/home/lado
      # The human's projects at the host's own path (LADO_REPOS above), so a worker's
      # worktree made in the container is one on the host too.
      - ${LADO_PROJECTS:?set LADO_PROJECTS to your projects folder}:${LADO_PROJECTS:?set LADO_PROJECTS to your projects folder}
    extra_hosts:
      # A local model on the host: Docker Desktop has it already, a Linux host needs it.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  home:
