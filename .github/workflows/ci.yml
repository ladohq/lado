name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get install -y tmux
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pytest -n auto
      # One process: on this 4-vCPU runner, -n auto's four integration tests at once (each
      # its own tmux, agents and session loop) starve each other past LADO's short test timers.
      - run: uv run pytest -m integration -n0

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: node --test tests/js/*.test.mjs

  # The web UI: types, unit tests and build (make web), the bundle in both the sdist and the
  # wheel (make dist), and the browser tests against a real lado server.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get install -y tmux
      - run: uv sync --locked
      - run: make dist
      - run: uv run playwright install --with-deps chromium
      # Two workers: a Chromium and a lado server each, on this 4-vCPU runner; -n auto's
      # four starve LADO's short test timers.
      - run: uv run pytest -m ui -n 2

  # Each provider's real CLI with LADO on Linux and macOS, no model: the smoke tests
  # (tests/smoke/), one cell per (system, provider), the CLI at its pin
  # (scripts/smoke_ci.py's PINS; tests/test_ci_workflow.py keeps the matrix the same).
  smoke:
    name: smoke ${{ matrix.os }} ${{ matrix.provider }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        provider: [claude, codex, opencode, kilo]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          python-version: "3.13"
      - name: tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y tmux
          else
            brew install tmux
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
      - name: uv sync
        run: uv sync --locked
      # Red unless the test passed and none skipped (a missing CLI skips).
      - name: Smoke test
        env:
          PROVIDER: ${{ matrix.provider }}
        run: uv run python scripts/smoke_ci.py run "$PROVIDER" "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.provider }}
          path: ${{ runner.temp }}/smoke
          retention-days: 5
