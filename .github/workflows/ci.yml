name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The whole CI on main once a day, the smoke with it: the pull requests that skip the
  # smoke do not leave a CLI's breakage unseen for long. GitHub mails a red scheduled run
  # to whoever last changed this cron line.
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

# A pull request's new run cancels its older one; any other run (a push to main, the
# schedule, a dispatch) is alone in its group, its run id, and is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The ruleset of main requires one check, ci-ok (the last job), whatever the jobs are named.
# Every job has a time limit, about twice its p90: a hung job ends red, not after GitHub's
# six hours.
jobs:
  # The oldest Python LADO takes, and the newest, which `uv tool install lado` picks by
  # default (3.14 changed pathlib's answers); the image's 3.13 is the other jobs'.
  unit:
    name: unit (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get install -y tmux
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pytest -n auto

  # The integration tests in three shards per Python (tests/shard.py: by a stable hash of
  # each test's node id), each on a runner of its own.
  integration:
    name: integration (${{ matrix.python-version }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get install -y tmux
      - run: uv sync --locked
      # One process: on this 4-vCPU runner, -n auto's four integration tests at once (each
      # its own tmux, agents and session loop) starve each other past LADO's short test timers.
      - run: uv run pytest -m integration -n0 --shard ${{ matrix.shard }}/3

  # The web UI: its stale-types check, types, unit tests and build (make web), the bundle in
  # both the sdist and the wheel (make dist); and the Node tests of the OpenCode-family
  # plugin. No UI job waits for it.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: make dist
      - run: node --test tests/js/*.test.mjs

  # The browser tests against a real lado server in four shards (tests/shard.py), each
  # building only the bundle they serve.
  ui:
    name: ui (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get install -y tmux
      - run: uv sync --locked
      - name: web UI bundle
        run: cd web && npm ci --no-audit --no-fund && npm run build
      # Chromium and the system packages its --with-deps downloads (fonts, from an Ubuntu
      # mirror that is sometimes slow or hangs) from a cache keyed by Playwright's version
      # and the runner image's: a new image takes a fresh --with-deps, never another's debs.
      - name: Browser cache key
        id: browser-key
        run: |
          version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')
          echo "key=ui-browser-${ImageOS:?}-${ImageVersion:?}-playwright-$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/lado-apt
          key: ${{ steps.browser-key.outputs.key }}
      # A hit installs the cached debs and finds Chromium in its cache, asking no mirror. A
      # miss runs --with-deps with apt's retries and a network timeout, and keeps the debs
      # it downloaded (none when the image has every package).
      - name: Browser
        timeout-minutes: 10
        env:
          HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then
            if compgen -G ~/.cache/lado-apt/'*.deb' > /dev/null; then
              sudo dpkg -i ~/.cache/lado-apt/*.deb
            fi
            uv run playwright install chromium
          else
            printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' \
              'APT::Keep-Downloaded-Packages "true";' \
              'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
              | sudo tee /etc/apt/apt.conf.d/90lado-ci
            uv run playwright install --with-deps chromium
            mkdir -p ~/.cache/lado-apt
            find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/.cache/lado-apt/ \;
          fi
      # Only outside a pull request: a pull request's cache is visible to it alone and would
      # spend the repository's 10 GB. Before the tests, so a red test loses nothing.
      - if: github.event_name != 'pull_request' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/lado-apt
          key: ${{ steps.browser-key.outputs.key }}
      # Two workers: a Chromium and a lado server each, on this 4-vCPU runner; -n auto's
      # four starve LADO's short test timers.
      - run: uv run pytest -m ui -n 2 --shard ${{ matrix.shard }}/4

  # Whether this run needs the smoke (scripts/smoke_ci.py needed): always but on a pull
  # request whose every changed file is on this skip list. No path here may be or hold one
  # the smoke runs (tests/test_ci_workflow.py refuses src/, scripts/, tests/ but tests/ui/
  # and tests/js/, docker/, pyproject.toml, uv.lock and .github/workflows/).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      smoke: ${{ steps.needed.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: needed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SMOKE_SKIP: |
            web/
            docs/
            openspec/
            tests/ui/
            tests/js/
            README.md
            CHANGELOG.md
            AGENTS.md
            BACKLOG.md
            ROADMAP.md
            SECURITY.md
            .github/dependabot.yml
        run: |
          if [ "$EVENT" = pull_request ]; then set -- "$BASE" "$HEAD"; else set --; fi
          python3 scripts/smoke_ci.py needed "$EVENT" "$@" >> "$GITHUB_OUTPUT"

  # Each provider's real CLI with LADO on Linux and macOS, no model: the smoke tests
  # (tests/smoke/), one cell per (system, provider), the CLI at its pin
  # (scripts/smoke_ci.py's PINS; tests/test_ci_workflow.py keeps the matrix the same).
  # Skipped by its condition, never by the triggers: ci-ok still reports.
  smoke:
    name: smoke ${{ matrix.os }} ${{ matrix.provider }}
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        provider: [claude, codex, opencode, kilo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.13"
      - name: tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y tmux
          else
            brew install tmux
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: uv sync
        run: uv sync --locked
      # Red unless the test passed and none skipped (a missing CLI skips).
      - name: Smoke test
        env:
          PROVIDER: ${{ matrix.provider }}
        run: uv run python scripts/smoke_ci.py run "$PROVIDER" "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.provider }}
          path: ${{ runner.temp }}/smoke
          retention-days: 5

  # LADO's image (docker/Dockerfile) built from this run's wheel on each architecture's own
  # runner, then the container tests (tests/container/) against it in two shards
  # (tests/shard.py), each cell building its own image, red unless its tests passed with no
  # skip (scripts/smoke_ci.py container). Every run, whatever it changes; nothing is pushed
  # anywhere.
  container:
    name: container (${{ matrix.arch }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        shard: [1, 2]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      # The image's layers from GitHub's cache, one scope per architecture: the runner's own
      # builder cannot use it, so a BuildKit builder of its own loads the image into Docker,
      # and the runtime's token and URLs go to the build's environment. A pull request reads
      # main's cache and writes none; a push to main reads and writes it; the daily and a
      # manual run build from nothing and write it anew, so a broken source (Debian, gh's
      # repository, npm) shows within a day. Only shard 1 writes, so two cells never write one
      # scope at once. The wheel is the Dockerfile's last layer, so a pull request rebuilds
      # only that. The release builds without any cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # The image's layers with their sizes: a new layer's size is the image's growth.
      - name: Image
        env:
          EVENT: ${{ github.event_name }}
          BUILDER: ${{ steps.buildx.outputs.name }}
          SCOPE: container-${{ matrix.arch }}
          SHARD: ${{ matrix.shard }}
        run: |
          write="--cache-to type=gha,mode=min,scope=$SCOPE"
          if [ "$SHARD" != 1 ]; then write=""; fi
          case "$EVENT" in
            pull_request) cache="--cache-from type=gha,scope=$SCOPE" ;;
            push) cache="--cache-from type=gha,scope=$SCOPE $write" ;;
            schedule | workflow_dispatch) cache="--no-cache $write" ;;
            *) echo "Image: no cache rule for the event $EVENT" >&2; exit 1 ;;
          esac
          make docker DOCKER_BUILD_FLAGS="--builder $BUILDER --load $cache"
          docker history lado:local
      - name: Container tests
        run: uv run python scripts/smoke_ci.py container "$RUNNER_TEMP/container" ${{ matrix.shard }}/2
      # The screenshot of tests/container/test_browser.py beside the cell's log.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-${{ matrix.arch }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/container
            /tmp/lado-container-shots
          retention-days: 5

  # The one check the ruleset of main requires: red unless every other job succeeded, the
  # smoke skipped only when changes said it is not needed (scripts/ci_ok.py). It runs
  # whatever their results: a skipped required check counts as passed.
  ci-ok:
    if: always()
    needs: [unit, integration, web, ui, changes, smoke, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_ok.py
