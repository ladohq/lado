# LADO's image (Dockerfile), ghcr.io/ladohq/lado:<version>, with compose: the same as one
# `docker run`, kept in a file. The guide, step by step: docs/install.md#docker. Keep the
# settings in .env next to this file, where compose reads them for every command:
#
#   LADO_VERSION=<version>              # the LADO version to run, e.g. the latest release's
#   LADO_PROJECTS=/Users/me/projects    # absolute: the container sees it at this path
#   LADO_PORT=8765                      # optional
#   LADO_GIT_NAME="Ann Lee"             # git's identity for the agents' commits
#   LADO_GIT_EMAIL=ann@example.com
#   LADO_SSH_AGENT=/run/host-services/ssh-auth.sock   # optional: the host's ssh agent
#   LADO_LISTEN=0.0.0.0                 # optional: open LADO to every device of your network
#                                       # (default 127.0.0.1, this computer only)
#   LADO_PUBLIC_HOST=my-mac.local       # optional: this computer's name for the UI's link
#                                       # for a phone (Open on another device)
#
# Then, from this folder:
#
#   docker compose up -d
#   docker compose exec lado lado ui --no-open               # the UI's link with its token
#
# The agents' variables (tokens, keys), optional: files in a folder secrets/ next to this
# file, one per variable. To give them, add LADO_SECRETS=./secrets to .env, then:
#
#   mkdir -m 700 secrets
#   docker compose up -d
#
# Without LADO_SECRETS there are none, and LADO says nothing about it (`lado doctor` says
# how to give them); with it, compose refuses to start while the folder is missing rather
# than make it. A file's name is the variable's, its content the value (one trailing
# newline dropped). LADO reads them at each agent's start, so a new file reaches the agents
# started after it, with no restart; they never show in `docker inspect`, and `lado doctor`
# lists the names it uses. E.g. `printf %s "$TOKEN" > secrets/GH_TOKEN`:
#   GH_TOKEN                  git over https to github.com and gh (or `gh auth login`
#                             inside: docker compose exec -it lado gh auth login)
#   CLAUDE_CODE_OAUTH_TOKEN   Claude Code's login, from `claude setup-token` (or log in once
#                             inside: docker compose exec -it lado claude)
#   YOUGILE_API_KEY           a kit's key, as its MCP server names it
#   OPENAI_API_KEY, ...       a model provider's key, for OpenCode and Kilo (or `opencode
#                             auth login` / `kilo auth login` inside)
# Logins made inside stay on the home volume. Codex's login is not covered yet. Every agent
# of the container can read every variable given to it: another LADO, with its own folder
# (or none) and home volume, keeps another set apart. LADO_SECRETS may name any folder.
#
# git: LADO_GIT_NAME and LADO_GIT_EMAIL are written to git's global config at every start;
# without them `docker compose logs lado` warns that agents cannot commit. ssh: set
# LADO_SSH_AGENT to the host's ssh agent socket, on a Mac Docker Desktop's
# /run/host-services/ssh-auth.sock, on Linux the host's $SSH_AUTH_SOCK (its path changes per
# login: point it at a stable socket, or `up -d` again after a new login); every agent of
# the container may then use the host's keys. Unset, there is none.
#
# LADO_PORT (8765) is the server's port in the container and the one published on this
# computer, always the same number: on its loopback, or on LADO_LISTEN's address.
# LADO_LISTEN=0.0.0.0 opens LADO to every device of your network, and on a laptop to every
# network it joins: whoever reaches it with the token can run commands as you, and the
# token travels unencrypted (plain HTTP). The container cannot learn this computer's
# address: LADO_PUBLIC_HOST names it for the link the UI shows (or LADO_LISTEN one address,
# e.g. 192.168.1.23, instead of 0.0.0.0). LADO_IMAGE, when set, runs another image
# instead of the version's (lado:local, which `make docker` builds); an older Compose
# still asks for LADO_VERSION beside it.
#
# To update, in this folder: keep a copy of this file, download the new version's
# compose.yaml in place of it, set the new LADO_VERSION in .env, then start (compose pulls
# that version's image):
#
#   cp compose.yaml compose.yaml.bak
#   curl -fLO https://github.com/ladohq/lado/releases/download/v<version>/compose.yaml
#   docker compose up -d
#
# A release may change this file (new mounts and settings), so each update takes its own.
# .env, secrets/ and the home volume stay; a change you made to this file by hand is
# replaced: `diff compose.yaml.bak compose.yaml` shows it, carry it over to the new one.
# Several LADOs on one machine: update each LADO in its own folder, with its own .env;
# nothing here touches another one's container or volume.
#
# A new version upgrades the home volume's lado.db at its start, after a copy of it in
# ~/.lado/backups/lado.db.schema-<N>, N its schema before (`docker compose logs lado`
# names it); an older one refuses the upgraded lado.db. The version before keeps its
# image and its tag. Back to the version you had before: put it back in .env and keep this
# compose.yaml (an older LADO ignores what it does not know), then (what
# LADO did since the upgrade is lost; when a migration failed, lado.db is as it was, and
# the first and the last command do it):
#
#   docker compose down
#   docker compose run --rm lado sh -c 'cd ~/.lado && rm -f lado.db-wal lado.db-shm && cp backups/lado.db.schema-<N> lado.db'
#   docker compose up -d
#
# A second LADO beside the first: a folder of its own with a copy of this file and an .env
# with its own COMPOSE_PROJECT_NAME (e.g. lado-2), LADO_PORT (8766), LADO_VERSION and
# LADO_PROJECTS, and a secrets/ of its own or none. It has its own container, home volume
# and version: updating one leaves the other as it is.
#
# The container's sessions go with it: `docker compose down` (or stop, or Docker's own end)
# stops its sessions, as `lado stop` would, and `docker compose up -d` (or start) resumes
# them, after an upgrade too; so does a start after the container was killed. `lado server
# stop` inside the container ends it the same way. Sessions
# stopped by hand stay stopped. Each resumed session's supervisor takes one model turn at
# the start, and starts the workers of its open flow runs.
name: lado

services:
  lado:
    image: ${LADO_IMAGE:-ghcr.io/ladohq/lado:${LADO_VERSION:?set LADO_VERSION to the LADO version to run, e.g. in .env next to this file}}
    hostname: lado
    environment:
      LADO_PORT: ${LADO_PORT:-8765}
      LADO_REPOS: ${LADO_PROJECTS:?set LADO_PROJECTS to your projects folder}
      # git's identity for the agents' commits, written at every start.
      LADO_GIT_NAME: ${LADO_GIT_NAME:-}
      LADO_GIT_EMAIL: ${LADO_GIT_EMAIL:-}
      # Where the port is published (below), and the name other devices reach this
      # computer by: the UI's link for a phone (Open on another device).
      LADO_LISTEN: ${LADO_LISTEN:-127.0.0.1}
      LADO_PUBLIC_HOST: ${LADO_PUBLIC_HOST:-}
    ports:
      # This computer only, unless LADO_LISTEN names another address: the UI's token is
      # the one guard, and it travels unencrypted.
      - "${LADO_LISTEN:-127.0.0.1}:${LADO_PORT:-8765}:${LADO_PORT:-8765}"
    volumes:
      # LADO_HOME (~/.lado) and Claude Code's login and config.
      - home:/home/lado
      # The human's projects at the host's own path (LADO_REPOS above), so a worker's
      # worktree made in the container is one on the host too.
      - ${LADO_PROJECTS:?set LADO_PROJECTS to your projects folder}:${LADO_PROJECTS:?set LADO_PROJECTS to your projects folder}
      # The agents' variables, one file each (LADO_ENV_DIR): never in docker inspect
      # (LADO_SECRETS; /dev/null: none).
      - type: bind
        source: ${LADO_SECRETS:-/dev/null}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
      # The host's ssh agent for the agents' git over ssh (LADO_SSH_AGENT; /dev/null: none).
      - type: bind
        source: ${LADO_SSH_AGENT:-/dev/null}
        target: /run/lado/ssh-agent.sock
        bind:
          create_host_path: false
    extra_hosts:
      # A local model on the host: Docker Desktop has it already, a Linux host needs it.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  home:
