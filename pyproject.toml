[project]
name = "lado"
version = "0.21.0"
description = "Layered Agent Delegation & Orchestration: run teams of AI coding agents (early development)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alexey Kolesnikov" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi>=0.142",
    "mcp>=2.2,<3",
    "pyyaml>=6",
    "tomli>=1.1; python_version < '3.11'",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.urls]
Homepage = "https://github.com/ladohq/lado"
Repository = "https://github.com/ladohq/lado"

[project.scripts]
lado = "lado.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The web UI's bundle (make web) is git-ignored; both the sdist and the wheel ship it.
[tool.hatch.build]
artifacts = ["src/lado/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/lado"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests (real tmux, git and agent processes, no LLM) run with `-m integration`,
# live tests (real agent CLIs and models) with `-m live`.
addopts = "-m 'not integration and not live and not ui'"
markers = [
    "ui: the web UI in a browser (Chromium) against a real lado server, fake agent; no LLM",
    "integration: real tmux, git and subprocesses with a fake agent; no LLM",
    "live: real agent CLIs and real models; costs tokens or needs network",
]
